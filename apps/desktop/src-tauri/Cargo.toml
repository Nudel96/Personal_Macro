[package]
name = "personal-macro-desktop"
version = "0.1.0"
description = "Local-first macro analysis and trading journal desktop application"
authors = ["Personal Macro"]
edition = "2024"
default-run = "personal-macro-desktop"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-plugin-store", "dep:tauri-plugin-fs"]
server = ["dep:axum", "dep:hmac"]
postgres = ["server", "sqlx/postgres", "dep:ring"]

[[bin]]
name = "personal-macro-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "personal-macro-server"
path = "src/bin/personal-macro-server.rs"
required-features = ["server"]

[[bin]]
name = "personal-macro-cloud"
path = "src/bin/personal-macro-cloud.rs"
required-features = ["postgres"]

[[example]]
name = "import_private_snapshot"
required-features = ["postgres"]

[[example]]
name = "finish_private_snapshot"
required-features = ["postgres"]

[[example]]
name = "publish_public_snapshot"
required-features = ["postgres"]

[[example]]
name = "atlas_public_qa"
required-features = ["desktop"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "personal_macro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid", "rust_decimal", "macros"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
regex = "1.12.3"
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
thiserror = "2.0.18"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
flate2 = "1.1.9"
mime_guess = "2.0.5"
walkdir = "2.5.0"
tauri-plugin-dialog = { version = "2.7.1", optional = true }
tauri-plugin-store = { version = "2.4.3", optional = true }
tauri-plugin-fs = { version = "2.5.1", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
dotenvy = "0.15.7"
pdf-extract = "0.12.0"
calamine = "0.36.1"
futures-util = "0.3.32"
keyring = "4.1.6"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.7"
scraper = "0.24.0"
base64 = "0.22.1"
axum = { version = "0.8.9", optional = true }
hmac = { version = "0.13.0", optional = true }
ring = { version = "0.17.14", optional = true }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.61.3", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
