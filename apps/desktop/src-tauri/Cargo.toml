[package]
name = "personal-macro-desktop"
version = "0.1.0"
description = "Local-first macro analysis and trading journal desktop application"
authors = ["Personal Macro"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "personal_macro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid", "rust_decimal", "macros"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
regex = "1.12.3"
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
thiserror = "2.0.18"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync"] }
csv = "1.4.0"
mime_guess = "2.0.5"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-fs = "2.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
dotenvy = "0.15.7"
pdf-extract = "0.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
